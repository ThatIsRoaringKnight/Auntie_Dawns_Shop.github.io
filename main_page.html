<!DOCTYPE html>
<html>
  <head>
    <title>Dawn's Shop</title>
    <style>
      section.container {
        display: flex;
        flex-wrap: wrap;
        width: 225px;
        height: 225px;
        /* FIX 1: was "border: 1px color:rgb(0,0,0);" — border needs a style keyword like "solid" */
        border: 1px solid rgb(0,0,0);
      }

      .moreContainer {
        position: relative;
        width: 225px;
        /* FIX 2: "hight" is a typo — the correct CSS property is "height" */
        height: 225px;
        /* FIX 3: same border fix here — needs "solid" (also had no semicolon at end) */
        border: 1px solid rgb(255,0,0);
      }

      .imOnTopOfTheLawAndBecauseImRight {
        position: absolute;
        top: 0px;
        right: 0px;
        width: 45px;
      }
    </style>
  </head>
  <body>
    <h1>Welcome to Dawn's Shop</h1>
    <p>This is the Main-Page.</p>
    <div class="moreContainer">
      <button type="button">
        <img src="Shopping_Cart.png" class="imOnTopOfTheLawAndBecauseImRight" alt="Go to the Cart">
      </button>
    </div>
  </body>
</html>
